[project]
name = "indic-eval"
version = "0.1.0"
description = "Reproducible LLM evaluation harness — packaged CLI around CeRAI AIEvaluationTool plus a 120-prompt Indic safety/bias suite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6",
  "openai>=1.40",
  "httpx>=0.27",
  "rich>=13",
]

[project.scripts]
indic-eval = "indic_eval.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["indic_eval", "indic_eval.tracks"]
